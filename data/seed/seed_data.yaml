runbooks:
- _key: KB-0001
  title: PostgreSQL connection limit exceeded
  steps:
  - 'Check current connections: SELECT count(*) FROM pg_stat_activity;'
  - 'Identify idle connections: SELECT * FROM pg_stat_activity WHERE state = ''idle'';'
  - 'Kill idle connections: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = ''idle'' AND query_start < now() - interval ''30 minutes'';'
  - Increase max_connections in postgresql.conf if needed
  - 'Restart PostgreSQL: sudo systemctl restart postgresql'
  category: Database
- _key: KB-0002
  title: NGINX 502 Bad Gateway troubleshooting
  steps:
  - 'Check if upstream service is running: systemctl status order-service'
  - 'Check NGINX error log: tail -100 /var/log/nginx/error.log'
  - Verify upstream port is correct in /etc/nginx/conf.d/upstream.conf
  - 'Test upstream directly: curl http://localhost:8080/health'
  - 'Restart NGINX if config changed: sudo nginx -t && sudo systemctl restart nginx'
  category: Application
- _key: KB-0003
  title: VPN connectivity troubleshooting
  steps:
  - 'Check VPN gateway status: show vpn ike-sa'
  - 'Verify IKE certificates are valid: show pki certificates'
  - Check firewall rules allow UDP 500 and 4500
  - 'Test IKE phase 1: ipsec statusall'
  - 'Restart VPN tunnel: ipsec restart'
  category: Network
- _key: KB-0004
  title: Kubernetes pod OOMKilled recovery
  steps:
  - 'Check pod status: kubectl describe pod <name> -n <namespace>'
  - 'Review container memory limits: kubectl get pod <name> -o yaml | grep -A5 resources'
  - 'Check container logs before crash: kubectl logs <name> --previous'
  - Increase memory limits in deployment YAML
  - 'Apply changes: kubectl apply -f deployment.yaml'
  category: Infrastructure
- _key: KB-0005
  title: SSL certificate renewal process
  steps:
  - 'Check certificate expiry: openssl s_client -connect host:443 2>/dev/null | openssl x509 -noout -dates'
  - 'Generate new CSR: openssl req -new -key server.key -out server.csr'
  - Submit CSR to Certificate Authority
  - 'Install new certificate: cp new-cert.pem /etc/ssl/certs/'
  - 'Reload service: sudo systemctl reload nginx'
  category: Security
- _key: KB-0006
  title: NFS mount failure recovery
  steps:
  - 'Check NFS server is running: systemctl status nfs-server'
  - 'Verify exports: showmount -e prod-nfs-01'
  - 'Check client mount: mount | grep nfs'
  - 'Unmount stale mount: umount -f /mnt/shared'
  - 'Remount: mount -t nfs prod-nfs-01:/export/shared /mnt/shared'
  category: Storage
- _key: KB-0007
  title: Redis memory management
  steps:
  - 'Check memory usage: redis-cli INFO memory'
  - 'Identify large keys: redis-cli --bigkeys'
  - 'Check current maxmemory policy: redis-cli CONFIG GET maxmemory-policy'
  - 'Set eviction policy: redis-cli CONFIG SET maxmemory-policy allkeys-lru'
  - 'Restart Redis if config persisted: sudo systemctl restart redis'
  category: Database
- _key: KB-0008
  title: Linux disk space recovery
  steps:
  - 'Check disk usage: df -h'
  - 'Find largest directories: du -sh /var/* | sort -rh | head'
  - 'Clean old logs: find /var/log -name ''*.gz'' -mtime +30 -delete'
  - 'Clean package cache: apt-get clean'
  - 'Remove old kernels: apt-get autoremove'
  category: Infrastructure
- _key: KB-0009
  title: LDAP account lockout resolution
  steps:
  - 'Check lockout policy: Get-ADDefaultDomainPasswordPolicy'
  - 'Find user in AD: Get-ADUser -Identity username -Properties LockedOut'
  - 'Unlock account: Unlock-ADAccount -Identity username'
  - 'Reset password if needed: Set-ADAccountPassword -Identity username'
  - 'Verify login: Test-ADAuthentication -Username username'
  category: Security
- _key: KB-0010
  title: Firewall rule change procedure
  steps:
  - Submit change request in ticketing system
  - 'Backup current rules: show running-config | redirect tftp://backup/fw-rules'
  - 'Apply new rule: set rulebase security rules <name> from <zone> to <zone> action allow'
  - 'Test connectivity: ping target && curl target:port'
  - Document change in change log
  category: Network
