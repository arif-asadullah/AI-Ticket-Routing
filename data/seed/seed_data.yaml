resolutions:
- ticket_title: Server prod-app-01 CPU at 100%
  steps:
  - Identified runaway Java process using top and jstack
  - Found infinite loop in OrderService batch processor
  - 'Killed the process: kill -9 <pid>'
  - Restarted OrderService with fixed config
  - Verified CPU returned to normal levels
  effectiveness: 0.85
  references_runbook: null
- ticket_title: Kernel panic on prod-k8s-node-02
  steps:
  - Analyzed kernel dump from /var/crash
  - Identified faulty DIMM module in slot 3
  - Replaced DIMM with spare from inventory
  - Rebooted server and verified memtest passes
  - Uncordoned node in Kubernetes cluster
  effectiveness: 0.95
  references_runbook: null
- ticket_title: Kubernetes pod OOMKilled repeatedly
  steps:
  - 'Checked pod memory limits: kubectl describe pod order-service-xyz'
  - Found memory limit was 512Mi, Java heap was 480Mi leaving no room for off-heap
  - Increased memory limit to 1Gi in deployment.yaml
  - 'Set JVM flags: -XX:MaxRAMPercentage=75.0'
  - 'Applied changes: kubectl apply -f deployment.yaml'
  effectiveness: 0.9
  references_runbook: KB-0004
- ticket_title: Disk space critical on prod-mon-01
  steps:
  - 'Checked disk usage: df -h showed 95% on /var'
  - Found Prometheus TSDB consuming 180GB
  - Reduced retention from 30d to 15d in prometheus.yml
  - 'Deleted old WAL segments: promtool tsdb clean /var/prometheus/data'
  - Disk usage dropped to 52%
  effectiveness: 0.8
  references_runbook: KB-0008
- ticket_title: Docker daemon not responding on prod-app-02
  steps:
  - 'Verified Docker daemon status: systemctl status docker'
  - Found daemon stuck in a deadlock state
  - 'Restarted Docker: sudo systemctl restart docker'
  - 'Cleaned up dangling images: docker system prune -f'
  - Verified all containers restarted successfully
  effectiveness: 0.85
  references_runbook: null
- ticket_title: NGINX returning 502 after deployment
  steps:
  - 'Checked OrderService was crashing on startup: journalctl -u order-service'
  - Found missing environment variable DATABASE_URL in new deployment config
  - Added DATABASE_URL to the deployment env section
  - Redeployed OrderService v2.3.1
  - Verified NGINX returning 200 on /api/orders
  effectiveness: 0.9
  references_runbook: KB-0002
- ticket_title: OrderService timeout on checkout API
  steps:
  - 'Identified slow database query: SELECT * FROM orders WHERE user_id = ? (no index)'
  - 'Created index: CREATE INDEX idx_orders_user_id ON orders(user_id)'
  - Query time dropped from 15s to 50ms
  - Restarted OrderService to clear connection pool
  - Verified checkout API response time under 500ms
  effectiveness: 0.95
  references_runbook: null
- ticket_title: API Gateway returning 504 for /api/users
  steps:
  - 'Checked AuthService status: systemctl status auth-service — inactive'
  - Found AuthService crashed due to memory exhaustion
  - 'Restarted AuthService: systemctl start auth-service'
  - Increased JVM heap from 256m to 512m
  - Verified /api/users responding with 200
  effectiveness: 0.85
  references_runbook: null
- ticket_title: AuthService JWT token validation failing
  steps:
  - Found JWT signing key was rotated but old key wasn't preserved
  - Added old key to the key rotation chain for backward compatibility
  - Redeployed AuthService with both old and new keys
  - Verified tokens signed with both keys are accepted
  effectiveness: 0.9
  references_runbook: null
- ticket_title: PostgreSQL not accepting connections on prod-db-01
  steps:
  - Checked max_connections was set to 100
  - Found 45 idle connections from stale app instances
  - 'Killed idle connections: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = ''idle'''
  - Increased max_connections to 200 in postgresql.conf
  - 'Restarted PostgreSQL: sudo systemctl restart postgresql'
  effectiveness: 0.95
  references_runbook: KB-0001
- ticket_title: Database replication lag exceeding 30 seconds
  steps:
  - 'Checked replication status: SELECT * FROM pg_stat_replication'
  - Found WAL sender process stuck due to network issue
  - Restarted pg_basebackup on replica
  - Rebuilt replica from primary snapshot
  - Verified replication lag under 1 second
  effectiveness: 0.9
  references_runbook: null
- ticket_title: Slow queries blocking production traffic
  steps:
  - Identified slow query with pg_stat_statements
  - Found missing index on orders(created_at, status)
  - 'Created index: CREATE INDEX idx_orders_created_status ON orders(created_at, status)'
  - Ran ANALYZE on orders table
  - Query time dropped from 15s to 80ms
  effectiveness: 0.95
  references_runbook: null
- ticket_title: Redis OOM on prod-app-01
  steps:
  - 'Checked memory: redis-cli INFO memory showed 4.2GB used'
  - Identified large session keys consuming 1.5GB
  - Set maxmemory-policy to allkeys-lru
  - Reduced session TTL from 24h to 4h
  - Memory usage dropped to 2.1GB
  effectiveness: 0.85
  references_runbook: KB-0007
- ticket_title: PostgreSQL backup job failed overnight
  steps:
  - Found backup process was killed by OOM killer
  - Increased backup server memory allocation
  - Set pg_dump to use --jobs=2 for parallel backup
  - 'Ran manual backup: pg_dump -Fd -j2 -f /backup/20260310'
  - Verified backup integrity with pg_restore --list
  effectiveness: 0.9
  references_runbook: null
- ticket_title: Database deadlock on orders table
  steps:
  - 'Identified deadlock pattern: two transactions updating related rows in different order'
  - Added advisory locks to enforce consistent ordering
  - Added retry logic in application code for deadlock errors
  - Deployed fix to prod-app-01 and prod-app-02
  - Monitored for 24h — zero deadlocks
  effectiveness: 0.8
  references_runbook: null
- ticket_title: VPN connection dropping intermittently
  steps:
  - 'Checked VPN gateway logs: found IKE rekey failures'
  - Discovered IKE certificates were about to expire
  - Renewed IKE Phase 1 certificates
  - 'Restarted VPN tunnel: ipsec restart'
  - Verified stable connection for 4 hours
  effectiveness: 0.9
  references_runbook: KB-0003
- ticket_title: DNS resolution failing for internal services
  steps:
  - Checked DNS service on prod-ldap-01
  - Found DNS service crashed due to corrupt zone file
  - Restored zone file from backup
  - Restarted DNS service
  - 'Flushed DNS cache on all servers: systemd-resolve --flush-caches'
  effectiveness: 0.95
  references_runbook: null
- ticket_title: Firewall blocking traffic to prod-db-01
  steps:
  - Identified missing allow rule for port 5432 from app subnet
  - Yesterday's change removed the rule accidentally
  - 'Re-added rule: allow tcp/5432 from 10.0.2.0/24 to 10.0.1.10'
  - 'Tested connectivity: telnet 10.0.1.10 5432'
  - Documented in change log
  effectiveness: 0.95
  references_runbook: KB-0010
- ticket_title: Load balancer health check failing for prod-web-02
  steps:
  - 'Checked NGINX health endpoint on prod-web-02: curl -I https://prod-web-02/health'
  - Found /health returning 404 — missing location block
  - Added health check location to nginx.conf
  - 'Reloaded NGINX: sudo nginx -s reload'
  - Updated LB health check URL to match new endpoint
  effectiveness: 0.85
  references_runbook: null
- title: SSL certificate expired on api-gateway
  steps:
  - 'Verified certificate expiry: openssl x509 -in cert.pem -noout -dates'
  - Generated new CSR with correct SAN entries
  - Obtained new certificate from internal CA
  - Installed certificate and reloaded API Gateway
  - Verified HTTPS working on all endpoints
  effectiveness: 0.95
  references_runbook: KB-0005
- ticket_title: Multiple failed login attempts on admin account
  steps:
  - Blocked source IP 10.0.2.15 in firewall
  - Traced IP to a compromised test VM
  - Isolated the VM from network
  - Reset domain admin password
  - Enabled MFA on all admin accounts
  effectiveness: 0.9
  references_runbook: null
- ticket_title: LDAP user locked out after password change
  steps:
  - 'Verified user account in AD: Get-ADUser meera.patel -Properties LockedOut'
  - Account was locked due to cached credentials on workstation
  - 'Unlocked account: Unlock-ADAccount meera.patel'
  - Cleared credential cache on workstation
  effectiveness: 0.95
  references_runbook: KB-0009
- ticket_title: Vulnerability scan found critical CVE on prod-web-01
  steps:
  - Confirmed CVE-2024-1234 affects NGINX 1.24
  - Downloaded patch from NGINX repository
  - 'Applied security patch: apt-get install nginx=1.24.1'
  - 'Restarted NGINX: sudo systemctl restart nginx'
  - Re-ran vulnerability scan — CVE no longer detected
  effectiveness: 0.9
  references_runbook: null
- ticket_title: Unauthorized SSH access attempt on prod-db-01
  steps:
  - 'Blocked attacking IP in firewall: deny 203.0.113.42'
  - Verified root login was already disabled in sshd_config
  - Added fail2ban with 3-attempt threshold
  - Rotated SSH host keys as precaution
  - Verified no unauthorized access occurred
  effectiveness: 0.95
  references_runbook: null
- ticket_title: NFS mount failing on prod-app-01
  steps:
  - 'Checked NFS server status: systemctl status nfs-server — running'
  - 'Verified exports: showmount -e prod-nfs-01'
  - 'Unmounted stale mount: umount -f /mnt/shared'
  - 'Remounted: mount -t nfs prod-nfs-01:/export/shared /mnt/shared'
  - Verified file access working
  effectiveness: 0.85
  references_runbook: KB-0006
- ticket_title: Stale NFS file handle on shared storage
  steps:
  - Identified all clients with stale handles
  - Unmounted NFS on all affected clients
  - 'Cleared NFS client cache: echo 3 > /proc/sys/vm/drop_caches'
  - Remounted NFS shares on all clients
  effectiveness: 0.8
  references_runbook: KB-0006
- ticket_title: NFS server prod-nfs-01 not responding
  steps:
  - SSH'd into prod-nfs-01 — server responsive but NFS daemon hung
  - 'Identified hung NFS threads: ps aux | grep nfsd'
  - 'Killed hung processes: killall -9 nfsd'
  - 'Restarted NFS daemon: systemctl restart nfs-server'
  - Verified all client mounts recovered
  effectiveness: 0.9
  references_runbook: KB-0006
- ticket_title: File system corruption detected on /data partition
  steps:
  - Stopped PostgreSQL to prevent further writes
  - 'Ran fsck: fsck -y /dev/sda2'
  - Repaired 3 corrupt inodes
  - Restored 2 missing files from last night's backup
  - Restarted PostgreSQL and verified data integrity
  effectiveness: 0.75
  references_runbook: null
- ticket_title: RAID array degraded on prod-nfs-01
  steps:
  - 'Identified failed disk in slot 3: mdadm --detail /dev/md0'
  - Hot-swapped failed disk with new drive
  - 'Started RAID rebuild: mdadm --manage /dev/md0 --add /dev/sdd'
  - 'Monitored rebuild progress: cat /proc/mdstat'
  - Rebuild completed in 4 hours, array healthy
  effectiveness: 0.95
  references_runbook: null
- ticket_title: BGP peering down with ISP
  steps:
  - Contacted ISP NOC — they confirmed maintenance on their router
  - Verified backup ISP routing was active
  - ISP completed maintenance and restored BGP session
  - 'Verified BGP peering re-established: show ip bgp summary'
  - Confirmed traffic routing through primary ISP
  effectiveness: 0.85
  references_runbook: null
