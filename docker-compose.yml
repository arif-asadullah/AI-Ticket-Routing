services:
  # ---------- ArangoDB (knowledge graph) ----------
  arangodb:
    image: arangodb:3.12
    mem_limit: 1g
    ports:
      - "8530:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-}
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "arangosh", "--server.endpoint", "tcp://127.0.0.1:8529", "--server.password", "", "--javascript.execute-string", "db._version()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atr-network

  # ---------- Redis (caching / pub-sub) ----------
  redis:
    image: redis:7
    mem_limit: 256m
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atr-network

  # ---------- FastAPI backend ----------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    mem_limit: 512m
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      ARANGO_URL: http://arangodb:8529
      REDIS_URL: redis://redis:6379
    depends_on:
      arangodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - atr-network

  # ---------- React frontend ----------
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: dev
    mem_limit: 256m
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - atr-network

volumes:
  arango_data:

networks:
  atr-network:
    driver: bridge
